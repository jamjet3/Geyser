name: Sync Geyser Upstream

on:
  workflow_dispatch:

  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

jobs:
  sync:
    name: Merge upstream Geyser
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MODN branch
        uses: actions/checkout@v7
        with:
          ref: modn-horse-accessories
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add official Geyser upstream
        run: |
          git remote add upstream https://github.com/GeyserMC/Geyser.git
          git fetch upstream master

      - name: Merge upstream master
        run: |
          git merge upstream/master --no-edit

      - name: Update submodules
        run: |
          git submodule update --init --recursive

      - name: Push MODN branch
        run: |
          git push origin modn-horse-accessories